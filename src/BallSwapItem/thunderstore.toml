[config]
schemaVersion = "0.0.1"

[general]
repository = "https://thunderstore.io"

[package]
namespace = "BETCGaming"
name = "BallSwapItem"
description = "Adds the Switcheroo: a pickup item that randomly swaps every player's ball."
websiteUrl = "https://github.com/BETCGaming/BallSwapItem"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack = "5.4.2305"

[build]
icon = "../../icon.png"
readme = "../../README.md"
outdir = "../../artifacts/thunderstore/"

[[build.copy]]
source = "../../artifacts/bin/BallSwapItem/release/com.github.BETCGaming.BallSwapItem.dll"
target = "plugins/"

[[build.copy]]
source = "../../CHANGELOG.md"
target = "/"

[[build.copy]]
source = "../../LICENSE"
target = "/"

# The following config options only apply when using TCLI to publish to Thunderstore directly:

[publish]
# See communities at:
# https://thunderstore.io/api/experimental/community/
communities = [ "super-battle-golf", ]

[publish.categories]
# See categories at:
# https://thunderstore.io/api/experimental/community/super-battle-golf/category/
super-battle-golf = [ "mods", ]
